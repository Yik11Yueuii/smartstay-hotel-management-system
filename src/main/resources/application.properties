spring.application.name=demo4
server.port=${SERVER_PORT:8080}

# Database connection. Environment variables override the local development defaults.
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# JSON date/time
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# Logging
logging.level.com.example.demo4=${APP_LOG_LEVEL:INFO}

# Authentication token
auth.token.secret=${AUTH_TOKEN_SECRET:hotel-management-local-secret-change-me}
auth.token.expire-hours=${AUTH_TOKEN_EXPIRE_HOURS:12}

# Operations automation
operations.reminder.enabled=${OPERATIONS_REMINDER_ENABLED:true}
operations.reminder.initial-delay-ms=${OPERATIONS_REMINDER_INITIAL_DELAY_MS:30000}
operations.reminder.scan-delay-ms=${OPERATIONS_REMINDER_SCAN_DELAY_MS:60000}

# Lightweight in-process API monitoring window (resets when the application restarts)
monitoring.api.max-samples=${MONITORING_API_MAX_SAMPLES:5000}
monitoring.api.window-minutes=${MONITORING_API_WINDOW_MINUTES:15}
monitoring.api.slow-threshold-ms=${MONITORING_API_SLOW_THRESHOLD_MS:500}
monitoring.api.error-rate-threshold=${MONITORING_API_ERROR_RATE_THRESHOLD:0.01}
monitoring.business-metrics.flush-enabled=${MONITORING_BUSINESS_METRICS_FLUSH_ENABLED:true}
monitoring.business-metrics.initial-delay-ms=${MONITORING_BUSINESS_METRICS_INITIAL_DELAY_MS:5000}
monitoring.business-metrics.flush-delay-ms=${MONITORING_BUSINESS_METRICS_FLUSH_DELAY_MS:5000}
