<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预订客房 - 酒店管理系统</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/user.css">
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar">
    <div class="nav-container">
        <div class="nav-brand">🏨 酒店管理系统</div>
        <div class="nav-menu">
            <a href="/pages/user/index.html">首页</a>
            <a href="/pages/user/room-list.html">客房列表</a>
            <a href="/pages/user/user-center.html">个人中心</a>
        </div>
        <div class="nav-user">
            <span id="userName">张三</span>
            <button class="btn btn-secondary" id="logoutBtn">退出</button>
        </div>
    </div>
</nav>

<!-- 主要内容 -->
<main class="main-content">
    <div class="container">
        <h2>预订客房</h2>

        <div class="booking-container">
            <!-- 客房信息 -->
            <div class="booking-section">
                <h3>客房信息</h3>
                <div id="roomInfo" class="room-info-box">
                    加载中...
                </div>
            </div>

            <!-- 预订表单 -->
            <form id="bookingForm" class="booking-form">
                <div class="form-group">
                    <label for="checkInDate">入住日期 *</label>
                    <input type="date" id="checkInDate" required>
                </div>

                <div class="form-group">
                    <label for="checkOutDate">退房日期 *</label>
                    <input type="date" id="checkOutDate" required>
                </div>

                <div class="form-group">
                    <label for="contactName">联系人姓名 *</label>
                    <input type="text" id="contactName" placeholder="请输入联系人姓名" required>
                </div>

                <div class="form-group">
                    <label for="contactPhone">联系电话 *</label>
                    <input type="tel" id="contactPhone" placeholder="请输入联系电话" required>
                </div>

                <div class="form-group">
                    <label for="remark">备注</label>
                    <textarea id="remark" rows="3" placeholder="其他需求或备注"></textarea>
                </div>

                <!-- 价格信息 -->
                <div class="price-summary">
                    <div class="smart-pricing-title">
                        <span>✨ 智能报价</span>
                        <span id="quoteStatus" class="quote-status">选择日期后实时计算</span>
                    </div>
                    <div class="price-item">
                        <span>动态均价:</span>
                        <span>¥<span id="unitPrice">0</span>/晚</span>
                    </div>
                    <div class="price-item">
                        <span>入住天数:</span>
                        <span><span id="days">0</span>天</span>
                    </div>
                    <div class="price-item total">
                        <span>预计总价:</span>
                        <span class="total-price">¥<span id="totalPrice">0</span></span>
                    </div>
                    <section id="pricingInsights" class="pricing-insights" hidden>
                        <div class="strategy-meta">
                            <span>本次报价依据</span>
                            <span id="strategyVersion" class="strategy-version"></span>
                        </div>
                        <div id="pricingRuleSummary" class="pricing-rule-summary"></div>
                        <details class="pricing-breakdown">
                            <summary>查看逐日价格与经营依据</summary>
                            <div id="nightlyPrices" class="nightly-prices"></div>
                        </details>
                    </section>
                </div>

                <button type="submit" class="btn btn-primary btn-block">确认预订</button>
            </form>
        </div>
    </div>
</main>

<script src="/js/dialog.js"></script>
<script>
    let currentRoom = null;
    let currentQuote = null;
    let bookingIdempotencyKey = null;
    let quoteRequestSequence = 0;

    function newIdempotencyKey() {
        return window.crypto && crypto.randomUUID
            ? crypto.randomUUID()
            : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + '-booking';
    }

    // 获取URL参数
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // 加载客房信息
    function loadRoomInfo() {
        const roomId = getQueryParam('roomId');

        if (!roomId) {
            alert('缺少客房参数');
            window.location.href = '/pages/user/room-list.html';
            return;
        }

        fetch('/api/room/' + roomId)
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    currentRoom = data.data;
                    const price = currentRoom.isPromotion ? currentRoom.promotionPrice : currentRoom.price;
                    document.getElementById('roomInfo').innerHTML =
                        '<strong>' + currentRoom.roomName + '</strong> (房间号: ' + currentRoom.roomNumber + ')<br>' +
                        '价格: ¥' + price + '/晚 ' + (currentRoom.isPromotion ? '<span class="badge badge-danger">促销</span>' : '');
                    document.getElementById('unitPrice').textContent = price;
                    calculatePrice();
                } else {
                    alert('加载客房信息失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('加载失败:', error);
                alert('加载客房信息失败,请检查后端是否启动');
            });
    }

    function formatMoney(value) {
        return Number(value || 0).toFixed(2);
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[char]));
    }

    function resetQuote(message) {
        currentQuote = null;
        document.getElementById('days').textContent = 0;
        document.getElementById('totalPrice').textContent = '0.00';
        document.getElementById('pricingInsights').hidden = true;
        document.getElementById('quoteStatus').textContent = message || '选择日期后实时计算';
        if (currentRoom) {
            const basePrice = currentRoom.isPromotion ? currentRoom.promotionPrice : currentRoom.price;
            document.getElementById('unitPrice').textContent = formatMoney(basePrice);
        }
    }

    function renderQuote(quote) {
        currentQuote = quote;
        document.getElementById('unitPrice').textContent = formatMoney(quote.averageNightlyPrice);
        document.getElementById('days').textContent = quote.nights;
        document.getElementById('totalPrice').textContent = formatMoney(quote.totalAmount);
        document.getElementById('quoteStatus').textContent = '已按实时需求计算';
        document.getElementById('strategyVersion').textContent = quote.strategyVersion;
        document.getElementById('pricingInsights').hidden = false;

        const allRules = quote.nightlyPrices.flatMap(night => night.adjustments);
        const uniqueRules = [...new Map(allRules.map(rule => [rule.ruleCode, rule])).values()];
        document.getElementById('pricingRuleSummary').innerHTML = uniqueRules.length
            ? uniqueRules.map(rule => {
                const direction = Number(rule.rate) < 0 ? 'discount' : 'premium';
                const sign = Number(rule.rate) > 0 ? '+' : '';
                return '<span class="pricing-rule-chip ' + direction + '" title="'
                    + escapeHtml(rule.reason) + '">' + escapeHtml(rule.ruleName) + ' '
                    + sign + Math.round(Number(rule.rate) * 100) + '%</span>';
            }).join('')
            : '<span class="pricing-rule-chip neutral">当前按基础价执行</span>';

        document.getElementById('nightlyPrices').innerHTML = quote.nightlyPrices.map(night => {
            const reasons = night.adjustments.length
                ? night.adjustments.map(rule => '<li>' + escapeHtml(rule.reason) + '（'
                    + (Number(rule.amount) > 0 ? '+' : '') + '¥' + formatMoney(rule.amount) + '）</li>').join('')
                : '<li>未触发调价规则</li>';
            return '<article class="night-price-card">'
                + '<div class="night-price-heading"><strong>' + escapeHtml(night.stayDate) + '</strong>'
                + '<strong class="night-final-price">¥' + formatMoney(night.finalPrice) + '</strong></div>'
                + '<div class="occupancy-hint">预测入住率 ' + Math.round(Number(night.occupancyRate) * 100)
                + '% · 基础价 ¥' + formatMoney(night.basePrice) + '</div>'
                + '<ul class="pricing-reasons">' + reasons + '</ul></article>';
        }).join('');
    }

    // 服务端根据入住率、日期和连住天数生成可解释报价
    async function calculatePrice() {
        const checkIn = document.getElementById('checkInDate').value;
        const checkOut = document.getElementById('checkOutDate').value;
        bookingIdempotencyKey = null;
        const requestSequence = ++quoteRequestSequence;
        if (!checkIn || !checkOut || !currentRoom || checkOut <= checkIn) {
            resetQuote(checkIn && checkOut ? '退房日期需晚于入住日期' : '选择日期后实时计算');
            return;
        }

        resetQuote('正在分析入住率与价格规则...');
        try {
            const response = await fetch('/api/pricing/quote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
                },
                body: JSON.stringify({roomId: currentRoom.id, checkInDate: checkIn, checkOutDate: checkOut})
            });
            const data = await response.json();
            if (requestSequence !== quoteRequestSequence) return;
            if (data.code === 401) {
                resetQuote('请先登录后获取智能报价');
                return;
            }
            if (data.code !== 200) throw new Error(data.message || '智能报价失败');
            renderQuote(data.data);
        } catch (error) {
            if (requestSequence !== quoteRequestSequence) return;
            console.error('智能报价失败:', error);
            resetQuote(error.message || '智能报价暂不可用');
        }
    }

    // 监听日期变化
    document.getElementById('checkInDate').addEventListener('change', calculatePrice);
    document.getElementById('checkOutDate').addEventListener('change', calculatePrice);

    // 设置最小日期为今天
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('checkInDate').min = today;
    document.getElementById('checkOutDate').min = today;

    // 提交预订
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!bookingIdempotencyKey) bookingIdempotencyKey = newIdempotencyKey();

        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!user) {
            alert('请先登录');
            window.location.href = '/pages/user/login.html';
            return;
        }

        const checkIn = document.getElementById('checkInDate').value;
        const checkOut = document.getElementById('checkOutDate').value;
        const contactName = document.getElementById('contactName').value;
        const contactPhone = document.getElementById('contactPhone').value;
        const remark = document.getElementById('remark').value;
        const days = parseInt(document.getElementById('days').textContent);
        const total = parseFloat(document.getElementById('totalPrice').textContent);

        if (!currentQuote || currentQuote.checkInDate !== checkIn || currentQuote.checkOutDate !== checkOut || days <= 0) {
            alert('请先获取有效的智能报价');
            return;
        }

        const bookingData = {
            userId: user.id,
            roomId: currentRoom.id,
            roomName: currentRoom.roomName,
            roomNumber: currentRoom.roomNumber,
            checkInDate: checkIn,
            checkOutDate: checkOut,
            days: days,
            price: currentQuote.averageNightlyPrice,
            totalAmount: total,
            contactName: contactName,
            contactPhone: contactPhone,
            remark: remark
        };

        console.log('提交预订数据:', bookingData);

        fetch('/api/booking/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + (localStorage.getItem('token') || ''),
                'Idempotency-Key': bookingIdempotencyKey
            },
            body: JSON.stringify(bookingData)
        })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('预订成功!');
                    window.location.href = '/pages/user/user-center.html';
                } else {
                    bookingIdempotencyKey = null;
                    alert('预订失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('预订失败:', error);
                alert('网络错误,请检查后端是否启动');
            });
    });

    // 检查登录
    function checkLogin() {
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user) {
            document.getElementById('userName').textContent = user.nickname || user.username;
        } else {
            document.getElementById('userName').textContent = '未登录';
        }
    }

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', async function() {
        if (await AppDialog.confirm('确定要退出吗?', '退出登录')) {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = '/pages/user/login.html';
        }
    });

    // 页面加载
    checkLogin();
    loadRoomInfo();
</script>
</body>
</html>
