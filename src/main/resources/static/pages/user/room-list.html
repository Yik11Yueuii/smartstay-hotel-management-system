<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客房列表 - 酒店管理系统</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/room-list.css">
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar">
    <div class="container">
        <div class="nav-logo">🏨 酒店管理系统</div>
        <div class="nav-links">
            <a href="/pages/user/index.html">首页</a>
            <a href="/pages/user/room-list.html" class="active">客房列表</a>
            <a href="/pages/user/user-center.html">个人中心</a>
        </div>
        <div class="nav-user">
            <span id="userName">未登录</span>
            <a href="/pages/user/login.html" id="loginBtn">登录</a>
            <button id="logoutBtn" style="display:none;">退出</button>
        </div>
    </div>
</nav>

<div class="container" style="margin-top: 30px;">
    <h1>客房列表</h1>

    <!-- 搜索筛选 -->
    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="搜索客房名称">
        <select id="typeFilter">
            <option value="">全部类型</option>
            <option value="大床房">大床房</option>
            <option value="双床房">双床房</option>
            <option value="家庭房">家庭房</option>
            <option value="套房">套房</option>
        </select>
        <button class="btn btn-primary" onclick="searchRooms()">搜索</button>
    </div>

    <!-- 客房列表 -->
    <div id="roomList" class="room-list"></div>
</div>

<script src="/js/dialog.js"></script>
<script src="/js/common.js"></script>
<script src="/js/room-list.js"></script>
</body>
</html>
