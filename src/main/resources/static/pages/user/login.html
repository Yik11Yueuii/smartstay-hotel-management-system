<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 酒店管理系统</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h2>🏨 酒店管理系统</h2>
        <p>欢迎回来,请登录您的账号</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">用户名</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="请输入用户名"
                    required
            >
            <div class="error-msg" id="usernameError">请输入用户名</div>
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="请输入密码"
                    required
            >
            <div class="error-msg" id="passwordError">请输入密码</div>
        </div>

        <button type="submit" class="btn-login">登录</button>
    </form>

    <div class="login-footer">
        <p>还没有账号? <a href="/pages/user/register.html">立即注册</a></p>
        <div class="divider">或</div>
        <p><a href="/pages/admin/admin-login.html">管理员登录入口</a></p>
    </div>
</div>

<script src="/js/dialog.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
