<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 酒店管理系统</title>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
<div class="register-container">
    <div class="register-header">
        <h2>🏨 用户注册</h2>
        <p>创建您的账号,开启预订之旅</p>
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label for="username">用户名 <span class="required">*</span></label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="请输入用户名(4-20个字符)"
                    required
            >
            <div class="error-msg" id="usernameError"></div>
        </div>

        <div class="form-group">
            <label for="password">密码 <span class="required">*</span></label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="请输入密码(6-20个字符)"
                    required
            >
            <div class="error-msg" id="passwordError"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">确认密码 <span class="required">*</span></label>
            <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="请再次输入密码"
                    required
            >
            <div class="error-msg" id="confirmPasswordError"></div>
        </div>

        <div class="form-group">
            <label for="nickname">昵称</label>
            <input
                    type="text"
                    id="nickname"
                    name="nickname"
                    placeholder="请输入昵称(可选)"
            >
        </div>

        <div class="form-group">
            <label for="phone">手机号</label>
            <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="请输入手机号(可选)"
            >
            <div class="error-msg" id="phoneError"></div>
        </div>

        <button type="submit" class="btn-register">注册</button>
    </form>

    <div class="register-footer">
        <p>已有账号? <a href="/pages/user/login.html">立即登录</a></p>
    </div>
</div>

<script src="/js/dialog.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
