<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 酒店管理系统</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h2>🏨 管理员登录</h2>
        <p>酒店管理系统后台</p>
    </div>

    <form id="adminLoginForm">
        <div class="form-group">
            <label for="username">管理员账号</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="请输入管理员账号"
                    required
            >
            <div class="error-msg" id="usernameError"></div>
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="请输入密码"
                    required
            >
            <div class="error-msg" id="passwordError"></div>
        </div>

        <button type="submit" class="btn-login">登录</button>
    </form>

    <div class="login-footer">
        <p><a href="/pages/user/login.html">← 返回用户登录</a></p>
    </div>
</div>

<script>
    const loginForm = document.getElementById('adminLoginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();

        usernameError.style.display = 'none';
        passwordError.style.display = 'none';

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        let isValid = true;

        if (username === '') {
            usernameError.textContent = '请输入管理员账号';
            usernameError.style.display = 'block';
            isValid = false;
        }

        if (password === '') {
            passwordError.textContent = '请输入密码';
            passwordError.style.display = 'block';
            isValid = false;
        }

        if (!isValid) return;

        // TODO: 替换为真实API
        // 测试账号: admin / admin123
        if (username === 'admin' && password === 'admin123') {
            alert('登录成功!');
            localStorage.setItem('admin', JSON.stringify({
                id: 1,
                username: 'admin',
                nickname: '系统管理员',
                role: 1
            }));
            location.href = '/pages/admin/admin-dashboard.html';
        } else {
            passwordError.textContent = '账号或密码错误';
            passwordError.style.display = 'block';
        }
    });
</script>
</body>
</html>
