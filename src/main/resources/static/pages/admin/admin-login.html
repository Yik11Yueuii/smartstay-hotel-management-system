<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 酒店管理系统</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h2>🏨 管理员登录</h2>
        <p>酒店管理系统后台</p>
    </div>

    <form id="adminLoginForm">
        <div class="form-group">
            <label for="username">管理员账号</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="请输入管理员账号"
                    required
            >
            <div class="error-msg" id="usernameError"></div>
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="请输入密码"
                    required
            >
            <div class="error-msg" id="passwordError"></div>
        </div>

        <button type="submit" class="btn-login">登录</button>
    </form>

    <div class="login-footer">
        <p><a href="/pages/user/login.html">← 返回用户登录</a></p>
    </div>
</div>

<script>
    const loginForm = document.getElementById('adminLoginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();

        usernameError.style.display = 'none';
        passwordError.style.display = 'none';

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        let isValid = true;

        if (username === '') {
            usernameError.textContent = '请输入管理员账号';
            usernameError.style.display = 'block';
            isValid = false;
        }

        if (password === '') {
            passwordError.textContent = '请输入密码';
            passwordError.style.display = 'block';
            isValid = false;
        }

        if (!isValid) return;

        fetch('/api/user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
            .then(response => response.json())
            .then(data => {
                if (data.code !== 200) {
                    throw new Error(data.message || '登录失败');
                }
                if (data.data.user.role !== 1) {
                    throw new Error('当前账号没有管理员权限');
                }

                localStorage.setItem('admin', JSON.stringify(data.data.user));
                localStorage.setItem('token', data.data.token);
                location.href = '/pages/admin/admin-dashboard.html';
            })
            .catch(error => {
                passwordError.textContent = error.message || '登录失败，请稍后重试';
                passwordError.style.display = 'block';
            });
    });
</script>
</body>
</html>
