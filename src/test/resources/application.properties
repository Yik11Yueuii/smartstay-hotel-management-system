spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:hotel_management_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.druid.validation-query=SELECT 1

spring.sql.init.mode=never
mybatis-plus.configuration.map-underscore-to-camel-case=true
logging.level.com.example.demo4=INFO

auth.token.secret=hotel-management-test-secret
auth.token.expire-hours=1
operations.reminder.enabled=false
monitoring.business-metrics.flush-enabled=false
